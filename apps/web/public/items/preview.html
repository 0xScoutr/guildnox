<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de itens — preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070406;
      --surface: #14090d;
      --line: #3a1a22;
      --text: #f4ebe6;
      --muted: #b29a97;
      --accent: #c21f2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Outfit, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 20px 48px;
    }
    h1 {
      margin: 0 0 6px;
      font-family: Cinzel, Georgia, serif;
      font-weight: 600;
      font-size: 28px;
    }
    p { margin: 0 0 22px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      max-width: 980px;
    }
    .card {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }
    .card img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      background: #000;
    }
    .card strong { display: block; font-size: 14px; line-height: 1.35; }
    .card span { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Catálogo de itens</h1>
  <p>Preview do banco de itens pro leilão.</p>
  <div class="grid" id="grid"></div>
  <script>
    fetch("./catalog.json")
      .then((r) => r.json())
      .then((data) => {
        const grid = document.getElementById("grid");
        for (const item of data.items || []) {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${item.image}" alt="">
            <div>
              <strong>${item.name}</strong>
              <span>${item.id}</span>
            </div>
          `;
          grid.append(card);
        }
      });
  </script>
</body>
</html>
